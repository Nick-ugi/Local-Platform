# The whole service on one server: the database, the API, the web app, and Caddy in front with the
# admin. The same Dockerfiles as Render (render.yaml). Run from the repository root:
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
# Only Caddy is reachable from outside (ports 80 and 443). See deploy/README.md.

name: queenstown-server

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: queenstown
      POSTGRES_USER: queenstown
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queenstown -d queenstown"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ../backend
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/queenstown
      SPRING_DATASOURCE_USERNAME: queenstown
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    environment:
      API_BASE_URL: http://api:8080
      SITE_URL: https://${WEB_HOST:?Set WEB_HOST in deploy/.env}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
      args:
        VITE_MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    environment:
      WEB_HOST: ${WEB_HOST}
      ADMIN_HOST: ${ADMIN_HOST:?Set ADMIN_HOST in deploy/.env}
      API_HOST: ${API_HOST:?Set API_HOST in deploy/.env}
      TLS_MODE: ${TLS_MODE:?Set TLS_MODE in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
