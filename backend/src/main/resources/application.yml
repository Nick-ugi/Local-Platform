spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:queenstown}
    username: ${DB_USER:queenstown}
    password: ${DB_PASSWORD:queenstown}
  mvc:
    problemdetails:
      enabled: true

# PORT is set by hosts such as Render; 8080 everywhere else.
server:
  port: ${PORT:8080}

# Tokens (docs/06-api-specification.md, section 1). JWT_SECRET signs the access tokens: at least 32
# bytes, and never the development value below outside a developer's machine.
app:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-change-me-0123456789}
    access-token-ttl: 15m
    refresh-token-ttl: 30d

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

management:
  endpoints:
    web:
      exposure:
        include: health
